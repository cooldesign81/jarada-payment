<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>자라다 인사관리</title>

<!-- Firebase compat SDK -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>

<style>
  /* 자라다(jarada.co.kr) 브랜드 톤 - 딥 네이비 + 웜 오렌지 포인트, 부드러운 라운드 카드 */
  :root{
    --navy:#16305c;
    --navy-dark:#0f2141;
    --accent:#ff8a3d;
    --accent-dark:#e8722a;
    --border:#e7e1d6;
    --bg:#faf6ef;
    --card:#ffffff;
    --text:#2a2a2a;
    --muted:#96907f;
    --danger:#d1483a;
    --ok:#3a8a52;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Pretendard","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text);
  }
  header{
    background:var(--navy); color:#fff; padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:30;
    box-shadow:0 2px 10px rgba(0,0,0,.12);
  }
  header .title{font-weight:800; font-size:17px; cursor:pointer; letter-spacing:-.3px;}
  header .userinfo{font-size:12px; opacity:.9; display:flex; align-items:center; gap:10px;}
  header button{
    background:rgba(255,255,255,.15); color:#fff; border:none; padding:7px 12px;
    border-radius:20px; font-size:12px; cursor:pointer;
  }
  .badge-admin{background:var(--accent); color:#3a1c00; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:800;}
  .badge-staff{background:rgba(255,255,255,.2); padding:3px 10px; border-radius:20px; font-size:11px;}

  .container{max-width:760px; margin:0 auto; padding:18px;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.03);
  }
  .card h3{margin:0 0 14px 0; font-size:15px; color:var(--navy-dark); border-bottom:2px solid var(--accent); padding-bottom:9px; font-weight:800;}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .field{flex:1 1 220px; margin-bottom:10px;}
  .field.wide{flex:1 1 100%;}
  .field.narrow{flex:0 1 150px; max-width:170px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--radius-sm); font-size:14px;
    background:#fffdfa;
  }
  .field input:focus, .field textarea:focus{outline:none; border-color:var(--accent);}
  .btn{
    display:inline-block; background:var(--navy); color:#fff; border:none;
    padding:11px 18px; border-radius:24px; font-size:14px; cursor:pointer; font-weight:700;
  }
  .btn:hover{background:var(--navy-dark);}
  .btn.accent{background:var(--accent);}
  .btn.accent:hover{background:var(--accent-dark);}
  .btn.secondary{background:#fff; color:var(--navy); border:1px solid var(--navy);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:6px 12px; font-size:12px;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  #loginScreen{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:20px;
  }
  #loginScreen .card{width:100%; max-width:380px;}
  #loginScreen h2{color:var(--navy-dark); text-align:center; font-weight:800;}
  .divider{text-align:center; color:var(--muted); font-size:12px; margin:16px 0; position:relative;}
  .divider::before,.divider::after{content:"";position:absolute;top:50%;width:40%;height:1px;background:var(--border);}
  .divider::before{left:0;} .divider::after{right:0;}

  .tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .tab-btn{
    background:#fff; border:1px solid var(--border); color:var(--muted);
    padding:9px 16px; border-radius:20px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .tab-btn.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  .emp-list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:13px 14px; border:1px solid var(--border); border-radius:var(--radius-sm); margin-bottom:8px;
    background:#fff;
  }
  .emp-list-item .info{cursor:pointer; flex:1;}
  .emp-list-item:hover{border-color:var(--accent);}
  .emp-list-item .name{font-weight:700; font-size:14px;}
  .emp-list-item .phone{font-size:12px; color:var(--muted);}
  .emp-list-item .actions{display:flex; gap:6px;}

  .search-bar{margin-bottom:14px;}
  .search-bar input{width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:20px; font-size:14px;}

  .dropzone{
    border:2px dashed var(--border); border-radius:var(--radius-sm); padding:16px;
    text-align:center; font-size:12px; color:var(--muted); cursor:pointer; margin-top:6px;
    transition:.15s;
  }
  .dropzone.dragover{border-color:var(--accent); background:#fff6ee; color:var(--accent-dark);}
  .dropzone input[type=file]{display:none;}
  .dropzone .dz-title{font-weight:700; color:var(--navy); font-size:13px; margin-bottom:4px;}

  .file-slot{margin-bottom:16px; padding-bottom:14px; border-bottom:1px solid var(--border);}
  .file-slot:last-child{border-bottom:none;}
  .label-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; gap:8px;}
  .file-slot .label{font-weight:700; font-size:13px;}
  .file-status{font-size:12px; color:var(--ok); font-weight:600;}
  .file-status.empty{color:var(--muted); font-weight:400;}

  .tag{
    display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px; background:#f1ede3; color:var(--muted); margin-left:6px;
  }
  .lock-note{
    font-size:12px; color:var(--muted); background:#fdf8ee; border:1px solid var(--border);
    border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:12px;
  }
  .top-actions{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .hidden{display:none !important;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,20,20,.45); display:flex; align-items:center; justify-content:center;
    z-index:50; padding:16px;
  }
  .modal-box{background:#fff; border-radius:var(--radius); padding:22px; width:100%; max-width:420px;}
  .modal-box h3{margin-top:0; color:var(--navy-dark);}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--navy-dark); color:#fff; padding:11px 20px; border-radius:24px; font-size:13px;
    z-index:100; opacity:0; transition:opacity .3s; max-width:90vw;
  }
  .toast.show{opacity:1;}

  .etc-item{border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; margin-bottom:10px; background:#fffdfa;}
  .etc-item input[type=text], .etc-item textarea{width:100%; padding:9px; border:1px solid var(--border); border-radius:8px; font-size:13px; margin-bottom:6px;}
  .etc-item textarea{resize:vertical; min-height:50px;}

  .back-link{font-size:13px; color:var(--navy); cursor:pointer; margin-bottom:12px; display:inline-block; font-weight:700;}
  small.hint{color:var(--muted); display:block; margin-top:4px; font-size:11px;}

  .resident-row{display:flex; align-items:center; gap:8px;}
  .resident-row input{max-width:140px;}
  .resident-sep{color:var(--muted); font-weight:700;}

  /* 셀프서비스(직원 개별 링크) 모드 */
  body.self-mode .top-actions, body.self-mode #statusTabs, body.self-mode .search-bar,
  body.self-mode .back-link, body.self-mode header .userinfo, body.self-mode #detailStatusTag{
    display:none !important;
  }
  body.self-mode header .title{cursor:default;}
  .self-banner{
    background:#fff6ee; border:1px solid var(--accent); border-radius:var(--radius-sm);
    padding:14px 16px; margin-bottom:16px; font-size:13px; color:var(--navy-dark); line-height:1.6;
  }
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="loginScreen">
  <div class="card">
    <h2>자라다 인사관리</h2>
    <button class="btn" style="width:100%" id="googleLoginBtn">Google로 로그인 (관리자)</button>
    <div class="divider">또는</div>
    <div class="field">
      <label>이메일 (관리자 공용 계정)</label>
      <input type="email" id="staffEmail" placeholder="admin@example.com" />
    </div>
    <div class="field">
      <label>비밀번호</label>
      <input type="password" id="staffPassword" placeholder="비밀번호" />
    </div>
    <button class="btn secondary" style="width:100%" id="staffLoginBtn">관리자 계정으로 로그인</button>
    <div id="loginError" style="color:var(--danger); font-size:12px; margin-top:10px;"></div>
  </div>
</div>

<!-- ============ APP SCREEN ============ -->
<div id="appScreen" class="hidden">
  <header>
    <div class="title" id="homeBtn">자라다 인사관리</div>
    <div class="userinfo">
      <span id="roleBadge"></span>
      <span id="userEmail"></span>
      <button id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <div class="container">

    <!-- LIST VIEW -->
    <div id="listView">
      <div class="top-actions">
        <button class="btn accent" id="newEmpBtn">+ 신규 직원 등록</button>
      </div>
      <div class="tabs" id="statusTabs"></div>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="이름 또는 전번으로 검색" />
      </div>
      <div id="empList"></div>
    </div>

    <!-- DETAIL VIEW -->
    <div id="detailView" class="hidden">
      <span class="back-link" id="backToListBtn">&larr; 목록으로</span>

      <div class="self-banner hidden" id="selfBanner">
        본인 정보와 서류를 입력·업로드해주세요. 저장하시면 바로 관리자에게 전달됩니다.
      </div>

      <div class="card">
        <div class="label-row">
          <h3 id="detailName" style="border:none; margin:0; padding:0;">-</h3>
          <button class="btn small secondary hidden" id="copySelfLinkBtn">등록 링크 복사</button>
        </div>
        <div class="field"><label>전번</label><div id="detailPhone">-</div></div>
        <div id="detailStatusTag"></div>
      </div>

      <!-- 주민등록번호 (최상위 보안) -->
      <div class="card">
        <h3>주민등록번호</h3>
        <div class="resident-row">
          <input type="text" id="residentFrontInput" placeholder="앞 6자리" maxlength="6" />
          <span class="resident-sep">-</span>
          <input type="password" id="residentBackInput" placeholder="뒤 7자리" maxlength="7" />
          <button type="button" class="btn small secondary" id="toggleBackVisibility">보기</button>
        </div>
        <div id="residentStatusLine" style="margin-top:8px; font-size:12px;"></div>
        <button class="btn small" id="saveResidentBtn" style="margin-top:10px;">주민번호 저장</button>
      </div>

      <!-- 개인 정보 -->
      <div class="card">
        <h3>개인 정보</h3>
        <div class="row" id="personalInfoFields"></div>
        <button class="btn" id="savePersonalBtn">개인정보 저장</button>
      </div>

      <!-- 급여 정보 (관리자 전용) -->
      <div class="card hidden" id="compensationCard">
        <h3>급여 정보 (관리자 전용)</h3>
        <div class="row">
          <div class="field">
            <label>기본급</label>
            <input type="number" id="compBaseSalary" placeholder="0" /> <small class="hint">원</small>
          </div>
          <div class="field">
            <label>식대</label>
            <input type="number" id="compMealAllowance" placeholder="0" /> <small class="hint">원</small>
          </div>
          <div class="field">
            <label>추가급여</label>
            <input type="number" id="compAdditionalSalary" placeholder="0" /> <small class="hint">원</small>
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label>인센티브 - 초과 기준</label>
            <input type="text" id="compIncentiveThreshold" placeholder="예: 5명 초과" />
          </div>
          <div class="field">
            <label>인센티브 - 금액</label>
            <input type="number" id="compIncentiveAmount" placeholder="0" /> <small class="hint">원</small>
          </div>
        </div>
        <div class="field">
          <label>기타 급여</label>
          <input type="text" id="compOtherSalary" placeholder="기타 급여 내역" />
        </div>

        <div class="field" style="margin-top:6px;">
          <label>퇴직금 중간 정산</label>
          <div id="severanceList"></div>
          <button class="btn secondary small" id="addSeveranceBtn" style="margin-top:6px;">+ 추가</button>
        </div>

        <div class="field" style="margin-top:6px;">
          <label>메모</label>
          <textarea id="compMemo" rows="6" placeholder="메모"></textarea>
        </div>

        <button class="btn accent" id="saveCompensationBtn" style="margin-top:8px;">급여 정보 저장</button>
      </div>

      <!-- 업로드 파일 항목1 -->
      <div class="card">
        <h3>서류 업로드</h3>
        <div id="cat1List"></div>
      </div>

      <!-- 업로드 파일 항목2 -->
      <div class="card">
        <h3>인사 평가 파일</h3>
        <div class="dropzone" id="cat2Dropzone">
          <div class="dz-title">📎 여러 파일을 한번에 끌어다 놓거나 클릭해서 선택</div>
          <div>(여러 개 선택 가능)</div>
          <input type="file" id="cat2FileInput" multiple />
        </div>
        <div id="cat2List" style="margin-top:12px;"></div>
      </div>

      <!-- 업로드 파일 항목3 (기타) -->
      <div class="card">
        <h3>기타</h3>
        <div id="cat3List"></div>
        <button class="btn secondary small" id="addEtcBtn">+ 항목 추가</button>
      </div>

    </div>
  </div>
</div>

<!-- NEW EMPLOYEE MODAL -->
<div id="newEmpModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h3>신규 직원 등록</h3>
    <div class="field">
      <label>이름</label>
      <input type="text" id="newEmpName" placeholder="이름" />
    </div>
    <div class="field">
      <label>전번</label>
      <input type="text" id="newEmpPhone" placeholder="010-0000-0000" />
    </div>
    <div style="display:flex; gap:8px; margin-top:14px;">
      <button class="btn accent" id="createEmpBtn" style="flex:1;">등록</button>
      <button class="btn secondary" id="cancelEmpBtn" style="flex:1;">취소</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   Firebase 프로젝트 설정값 (jarada-hr)
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyCVLgzR9IJaw4lKNaq5ZpHqiQhGKctaofc",
  authDomain: "jarada-hr.firebaseapp.com",
  projectId: "jarada-hr",
  storageBucket: "jarada-hr.firebasestorage.app",
  messagingSenderId: "1069236694564",
  appId: "1:1069236694564:web:17ce7ffa10b00e0074b2b1"
};

const SUPER_ADMIN_EMAIL = "jinhyuck@gmail.com"; // 대표자 계정 (Google) - 전체 권한
const MANAGER_EMAIL = "jarada_boys@naver.com"; // 관리자 공용 계정 (이메일) - 제한된 권한
const CATEGORY1_LIMITED_KEYS = ['resume', 'portfolio', 'criminalRecord', 'diploma'];

function canDownloadCategory1(key){
  return isAdminUser || (isManagerUser && CATEGORY1_LIMITED_KEYS.includes(key));
}
function canDeleteCategory1(key){
  return canDownloadCategory1(key);
}

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

let currentEmpId = null;
let isAdminUser = false;
let isManagerUser = false;
let isAnonymousUser = false;
let currentTab = 'active'; // active | retired | deleted(admin only)
const selfServiceEmpId = new URLSearchParams(location.search).get('self');

// ---------- Utilities ----------
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}
function show(el){el.classList.remove('hidden');}
function hide(el){el.classList.add('hidden');}
function $(id){return document.getElementById(id);}
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function makeDropzone(el, onFiles){
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('dragover'); });
  el.addEventListener('dragleave', () => el.classList.remove('dragover'));
  el.addEventListener('drop', e => {
    e.preventDefault(); el.classList.remove('dragover');
    if(e.dataTransfer.files && e.dataTransfer.files.length) onFiles(Array.from(e.dataTransfer.files));
  });
}
function makePasteZone(el, onFiles){
  el.setAttribute('tabindex','0');
  el.addEventListener('paste', e => {
    const items = e.clipboardData ? e.clipboardData.items : [];
    const files = [];
    for(const item of items){
      if(item.type && item.type.indexOf('image') === 0){
        const file = item.getAsFile();
        if(file) files.push(file);
      }
    }
    if(files.length) onFiles(files);
  });
}

// ---------- Auth ----------
$('googleLoginBtn').onclick = () => {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => {
    $('loginError').textContent = "로그인 실패: " + err.message;
  });
};

$('staffLoginBtn').onclick = () => {
  const email = $('staffEmail').value.trim();
  const pw = $('staffPassword').value;
  if(!email || !pw){ $('loginError').textContent = "이메일과 비밀번호를 입력하세요."; return; }
  auth.signInWithEmailAndPassword(email, pw).catch(err => {
    $('loginError').textContent = "로그인 실패: " + err.message;
  });
};

$('logoutBtn').onclick = () => auth.signOut();

auth.onAuthStateChanged(user => {
  if(user){
    isAnonymousUser = !!user.isAnonymous;

    if(isAnonymousUser){
      // 익명 세션은 반드시 본인 등록 링크(?self=)를 통해서만 유효함.
      // 링크 없이 남아있는 익명 세션이면 즉시 로그아웃시켜 목록/다른 정보 접근을 원천 차단.
      if(!selfServiceEmpId){
        auth.signOut();
        return;
      }
      isAdminUser = false;
      document.body.classList.add('self-mode');
      hide($('loginScreen'));
      show($('appScreen'));
      document.querySelector('header .title').textContent = '자라다 인사정보 등록';
      show($('selfBanner'));
      showDetailView(selfServiceEmpId);
      return;
    }

    isAdminUser = (user.email === SUPER_ADMIN_EMAIL);
    isManagerUser = (user.email === MANAGER_EMAIL);
    $('userEmail').textContent = user.email || '';
    $('roleBadge').innerHTML = (isAdminUser || isManagerUser)
      ? '<span class="badge-admin">관리자</span>'
      : '<span class="badge-staff">직원</span>';
    hide($('loginScreen'));
    show($('appScreen'));
    renderTabs();
    showListView();
    listenEmployeeList();
  } else {
    if(selfServiceEmpId){
      auth.signInAnonymously().catch(err => {
        show($('loginScreen'));
        $('loginError').textContent = "접속 실패: " + err.message;
      });
      return;
    }
    show($('loginScreen'));
    hide($('appScreen'));
  }
});

// ---------- Navigation ----------
if(!selfServiceEmpId){
  $('homeBtn').onclick = showListView;
  $('backToListBtn').onclick = showListView;
}

function showListView(){
  currentEmpId = null;
  hide($('detailView'));
  show($('listView'));
}
function showDetailView(empId){
  currentEmpId = empId;
  hide($('listView'));
  show($('detailView'));
  loadEmployeeDetail(empId);
}

// ---------- Tabs ----------
function renderTabs(){
  const wrap = $('statusTabs');
  const tabs = [
    {key:'active', label:'재직자'},
    {key:'retired', label:'퇴직자'},
  ];
  if(isAdminUser || isManagerUser) tabs.push({key:'deleted', label:'삭제됨'});
  wrap.innerHTML = '';
  tabs.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (currentTab === t.key ? ' active' : '');
    btn.textContent = t.label;
    btn.onclick = () => { currentTab = t.key; renderTabs(); renderEmployeeList(); };
    wrap.appendChild(btn);
  });
}

let allEmployees = [];

function listenEmployeeList(){
  db.collection('employees').orderBy('name').onSnapshot(snap => {
    allEmployees = [];
    snap.forEach(doc => allEmployees.push({id: doc.id, ...doc.data()}));
    renderEmployeeList();
  }, err => {
    console.error(err);
  });
}

function renderEmployeeList(){
  const q = ($('searchInput').value || '').trim();
  const list = $('empList');
  list.innerHTML = '';
  const filtered = allEmployees.filter(e => {
    const status = e.status || 'active';
    if(status !== currentTab) return false;
    return !q || (e.name && e.name.includes(q)) || (e.phone && e.phone.includes(q));
  });
  if(filtered.length === 0){
    list.innerHTML = '<div style="color:var(--muted); font-size:13px; padding:10px;">해당하는 직원이 없습니다.</div>';
    return;
  }
  filtered.forEach(e => {
    const div = document.createElement('div');
    div.className = 'emp-list-item';
    let actionsHtml = '';
    if(currentTab === 'active'){
      actionsHtml = `<button class="btn small secondary" data-act="retire">퇴직</button>`;
    } else if(currentTab === 'retired'){
      actionsHtml = `<button class="btn small secondary" data-act="reinstate">복직</button>
                      <button class="btn small danger" data-act="delete">삭제</button>`;
    } else if(currentTab === 'deleted'){
      actionsHtml = `<button class="btn small secondary" data-act="restore">복원</button>`
        + (isAdminUser ? `<button class="btn small danger" data-act="purge">완전 삭제</button>` : '');
    }
    div.innerHTML = `
      <div class="info"><div class="name">${escapeHtml(e.name||'')}</div><div class="phone">${escapeHtml(e.phone||'')}</div></div>
      <div class="actions">${actionsHtml}</div>
    `;
    div.querySelector('.info').onclick = () => showDetailView(e.id);
    const actBtns = div.querySelectorAll('button[data-act]');
    actBtns.forEach(btn => {
      btn.onclick = (ev) => {
        ev.stopPropagation();
        const act = btn.dataset.act;
        if(act === 'retire') changeStatus(e.id, e.name, 'retired', '퇴직 처리하시겠습니까?');
        if(act === 'reinstate') changeStatus(e.id, e.name, 'active', '복직 처리하시겠습니까?');
        if(act === 'delete') changeStatus(e.id, e.name, 'deleted', `${e.name} 님을 삭제하시겠습니까?\n삭제된 명단은 관리자만 볼 수 있습니다.`);
        if(act === 'restore') changeStatus(e.id, e.name, 'active', '재직 상태로 복원하시겠습니까?');
        if(act === 'purge') purgeEmployee(e.id, e.name);
      };
    });
    list.appendChild(div);
  });
}
$('searchInput').oninput = renderEmployeeList;

async function deleteStorageFolder(ref){
  try{
    const res = await ref.listAll();
    for(const item of res.items){ await item.delete().catch(()=>{}); }
    for(const prefix of res.prefixes){ await deleteStorageFolder(prefix); }
  }catch(err){
    // 파일이 없거나 폴더가 비어있으면 조용히 통과
  }
}

async function purgeEmployee(empId, name){
  const pw = prompt(`"${name}" 님의 데이터를 완전히 삭제합니다.\n이 작업은 절대 되돌릴 수 없습니다.\n\n계속하려면 비밀번호를 입력하세요.`);
  if(pw === null) return;
  if(pw !== '1492'){ toast('비밀번호가 올바르지 않습니다.'); return; }
  if(!confirm(`정말로 "${name}" 님의 모든 정보(개인정보, 서류, 급여 정보 포함)를 영구 삭제하시겠습니까?\n\n마지막 확인입니다.`)) return;

  toast('삭제 중입니다...');
  try{
    await deleteStorageFolder(storage.ref(`hr/${empId}`));
    const privateRef = db.collection('employees').doc(empId).collection('private');
    await privateRef.doc('residentFront').delete().catch(()=>{});
    await privateRef.doc('residentBack').delete().catch(()=>{});
    await privateRef.doc('files').delete().catch(()=>{});
    await privateRef.doc('compensation').delete().catch(()=>{});
    await db.collection('employees').doc(empId).delete();
    toast('완전히 삭제되었습니다.');
  }catch(err){
    toast('삭제 실패: ' + err.message);
  }
}

async function changeStatus(empId, name, newStatus, confirmMsg){
  if(!confirm(confirmMsg)) return;
  try{
    await db.collection('employees').doc(empId).update({
      status: newStatus,
      statusUpdatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      statusUpdatedBy: auth.currentUser.email
    });
    toast('처리되었습니다.');
  }catch(err){
    toast('처리 실패: ' + err.message);
  }
}

function loadEmployeeDetail(empId){
  if(!selfServiceEmpId){
    show($('copySelfLinkBtn'));

      const url = `${location.origin}${location.pathname}?self=${empId}`;
      if(navigator.clipboard && navigator.clipboard.writeText){

      }

// ---------- Category 1: 고정 항목 (드래그&드롭 + 붙여넣기 지원) ----------
function renderCat1(filesData, uploadStatus){
  const wrap = $('cat1List');
  wrap.innerHTML = '';
  uploadStatus = uploadStatus || {};
  const canSeeFileList = isAdminUser || isManagerUser;
  CATEGORY1_ITEMS.forEach(item => {
    const fileInfo = filesData ? filesData[item.key] : null;
    const slot = document.createElement('div');
    slot.className = 'file-slot';
    const allowDl = canDownloadCategory1(item.key);
    const allowDel = canDeleteCategory1(item.key);

    let statusHtml;
    if(canSeeFileList){
      if(fileInfo){
        statusHtml = `<span class="file-status">✔ ${escapeHtml(fileInfo.name||'업로드됨')}</span>`
          + (allowDl ? ` <button class="btn small secondary" data-dl>다운로드</button>` : '')
          + (allowDel ? ` <button class="btn small danger" data-del>삭제</button>` : '');
      } else {
        statusHtml = `<span class="file-status empty">미업로드</span>`;
      }
    } else {
      statusHtml = uploadStatus[item.key]
        ? `<span class="file-status">✔ 이미 등록됨 (열람은 관리자만 가능)</span>`
        : `<span class="file-status empty">미등록</span>`;
    }

    slot.innerHTML = `
      <div class="label-row">
        <div class="label">${item.label}</div>
        <div>${statusHtml}</div>
      </div>
      <div class="dropzone" data-zone="${item.key}">
        <div class="dz-title">📎 파일을 끌어다 놓거나 클릭해서 선택</div>
        <input type="file" data-upload="${item.key}" />
      </div>
    `;
    wrap.appendChild(slot);

    const zone = slot.querySelector(`[data-zone="${item.key}"]`);
    const input = slot.querySelector(`input[data-upload="${item.key}"]`);
    zone.onclick = (e) => { if(e.target !== input) input.click(); };
    input.onchange = (e) => { if(e.target.files[0]) uploadCategory1File(item.key, item.label, e.target.files[0]); };
    makeDropzone(zone, files => { if(files[0]) uploadCategory1File(item.key, item.label, files[0]); });

    if(fileInfo){
      const dlBtn = slot.querySelector('button[data-dl]');
      if(dlBtn) dlBtn.onclick = () => downloadFile(fileInfo.path, fileInfo.name);
      const delBtn = slot.querySelector('button[data-del]');
      if(delBtn) delBtn.onclick = () => deleteCategory1File(item.key, item.label, fileInfo);
    }
  });
}

async function uploadCategory1File(key, label, file){
  if(!currentEmpId) return;
  toast(`${label} 업로드 중...`);
  try{
    const path = `hr/${currentEmpId}/category1/${key}_${Date.now()}_${file.name}`;
    const ref = storage.ref(path);
    await ref.put(file);
    await db.collection('employees').doc(currentEmpId).collection('private').doc('files')
      .set({
        category1: { [key]: {
          name: file.name, path,
          uploadedAt: firebase.firestore.FieldValue.serverTimestamp(),
          uploadedBy: auth.currentUser.email
        } }
      }, {merge:true});
    await db.collection('employees').doc(currentEmpId).update({['uploadStatus.' + key]: true});
    toast(`${label} 업로드 완료`);
  }catch(err){
    toast('업로드 실패: ' + err.message);
  }
}

async function uploadCategory2Files(fileList){

  toast(`${fileList.length}개 파일 업로드 중...`);
  try{
    for(const file of fileList){
      const path = `hr/${currentEmpId}/category2/${Date.now()}_${file.name}`;
      const ref = storage.ref(path);
      await ref.put(file);
      await db.collection('employees').doc(currentEmpId).collection('private').doc('files')
        .set({
          category2: firebase.firestore.FieldValue.arrayUnion({
            name: file.name, path,
            uploadedAt: new Date().toISOString(),
            uploadedBy: auth.currentUser.email
          })
        }, {merge:true});
    }
    toast('업로드 완료');
  }catch(err){
    toast('업로드 실패: ' + err.message);
  }
}

  div.className = 'etc-item';
  div.innerHTML = `
    <input type="text" placeholder="항목명 (예: 자격증 사본)" id="${id}_label" />
    <textarea placeholder="파일 설명 (선택)" id="${id}_desc"></textarea>
    <div class="dropzone" id="${id}_zone">
      <div class="dz-title">📎 파일을 끌어다 놓거나 클릭해서 선택</div>
      <input type="file" id="${id}_file" />
    </div>
    <button class="btn small" id="${id}_btn" style="margin-top:8px;">업로드</button>
  `;
  wrap.appendChild(div);

  const zone = $(id+'_zone');
  const fileInput = $(id+'_file');
  zone.onclick = (e) => { if(e.target !== fileInput) fileInput.click(); };

  const doUpload = async (file) => {
    const label = $(id+'_label').value.trim();
    const description = $(id+'_desc').value.trim();
    if(!label || !file){ toast('항목명과 파일을 모두 입력하세요.'); return; }
    toast('업로드 중...');
    try{
      const path = `hr/${currentEmpId}/category3/${Date.now()}_${file.name}`;
      const ref = storage.ref(path);
      await ref.put(file);
      await db.collection('employees').doc(currentEmpId).collection('private').doc('files')
        .set({
          category3: firebase.firestore.FieldValue.arrayUnion({
            label, description, name: file.name, path,
            uploadedAt: new Date().toISOString(),
            uploadedBy: auth.currentUser.email
          })
        }, {merge:true});
      toast('업로드 완료');
      div.remove();
    }catch(err){
      toast('업로드 실패: ' + err.message);
    }
  };

  fileInput.onchange = (e) => { if(e.target.files[0]) doUpload(e.target.files[0]); };
  makeDropzone(zone, files => { if(files[0]) doUpload(files[0]); });
  $(id+'_btn').onclick = () => { if(fileInput.files[0]) doUpload(fileInput.files[0]); else toast('파일을 선택하세요.'); };
};

// ---------- Download (관리자 전용, Storage 규칙으로도 강제) ----------
async function downloadFile(path, name){
  try{
    const url = await storage.ref(path).getDownloadURL();
    const a = document.createElement('a');
    a.href = url;
    a.download = name || 'file';
    a.target = '_blank';
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(err){
    toast('다운로드 실패: ' + err.message);
  }
}

// ---------- 급여 정보 (관리자 전용 - 직원은 필드 자체를 볼 수 없음) ----------
function renderCompensation(data){
  data = data || {};
  $('compBaseSalary').value = data.baseSalary || '';
  $('compMealAllowance').value = data.mealAllowance || '';
  $('compAdditionalSalary').value = data.additionalSalary || '';
  $('compIncentiveThreshold').value = data.incentiveThreshold || '';
  $('compIncentiveAmount').value = data.incentiveAmount || '';
  $('compOtherSalary').value = data.otherSalary || '';
  $('compMemo').value = data.memo || '';
  severanceEntries = Array.isArray(data.severanceSettlements) ? data.severanceSettlements.map(e => ({...e})) : [];
  renderSeveranceList();
}

function renderSeveranceList(){
  const wrap = $('severanceList');
  wrap.innerHTML = '';
  severanceEntries.forEach((entry, idx) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.alignItems = 'center';
    row.innerHTML = `
      <input type="number" placeholder="년" style="max-width:80px;" data-sev="${idx}-year" value="${escapeHtml(entry.year||'')}" />
      <input type="number" placeholder="월" style="max-width:60px;" data-sev="${idx}-month" value="${escapeHtml(entry.month||'')}" />
      <input type="number" placeholder="일" style="max-width:60px;" data-sev="${idx}-day" value="${escapeHtml(entry.day||'')}" />
      <input type="number" placeholder="금액(원)" style="max-width:140px;" data-sev="${idx}-amount" value="${escapeHtml(entry.amount||'')}" />
      <button class="btn small danger" data-sev-remove="${idx}">삭제</button>
    `;
    wrap.appendChild(row);
  });
  wrap.querySelectorAll('input[data-sev]').forEach(inp => {
    inp.oninput = () => {
      const [idx, field] = inp.dataset.sev.split('-');
      severanceEntries[idx][field] = inp.value;
    };
  });
  wrap.querySelectorAll('button[data-sev-remove]').forEach(btn => {
    btn.onclick = () => {
      severanceEntries.splice(Number(btn.dataset.sevRemove), 1);
      renderSeveranceList();
    };
  });
}

$('addSeveranceBtn').onclick = () => {
  severanceEntries.push({year:'', month:'', day:'', amount:''});
  renderSeveranceList();
};

$('saveCompensationBtn').onclick = async () => {
  if(!currentEmpId) return;
  const payload = {
    baseSalary: $('compBaseSalary').value.trim(),
    mealAllowance: $('compMealAllowance').value.trim(),
    additionalSalary: $('compAdditionalSalary').value.trim(),
    incentiveThreshold: $('compIncentiveThreshold').value.trim(),
    incentiveAmount: $('compIncentiveAmount').value.trim(),
    otherSalary: $('compOtherSalary').value.trim(),
    memo: $('compMemo').value.trim(),
    severanceSettlements: severanceEntries,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
    updatedBy: auth.currentUser.email
  };
  try{
    await db.collection('employees').doc(currentEmpId).collection('private').doc('compensation')
      .set(payload, {merge:true});
    toast('급여 정보가 저장되었습니다.');
  }catch(err){
    toast('저장 실패: ' + err.message);
  }
};
